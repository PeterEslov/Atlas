# Azure Pipelines definition for Del 8 (see docs/AZURE_DEPLOYMENT.md,
# section 5, for how the "azureServiceConnection" below gets created and
# authenticated — a Workload Identity federation service connection, no
# stored secret of any kind).
#
# Two stages, mirroring the original GitHub Actions design this replaced:
# BuildAndTest always runs (on every push and PR against main); Deploy only
# runs on main itself, and only if BuildAndTest succeeded. Deliberately a
# plain job (not a "deployment" job against an Environment) to keep this
# Del's scope to "a pipeline that deploys automatically" — approval gates /
# Environments are a natural follow-up, not something Del 8 needs.
#
# Del 18 added a second job to BuildAndTest, DockerBuild — see its own
# comment below for why it's a separate job, and why it deliberately only
# builds the Del 17 image rather than pushing it anywhere.

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  buildConfiguration: 'Release'
  azureServiceConnection: 'sc-projectatlas-dev-sc'   # set to your actual service connection name (docs/AZURE_DEPLOYMENT.md section 5)
  webAppName: 'app-projectatlas-dev-sc'              # set to your actual Web App name (docs/AZURE_DEPLOYMENT.md section 1)

stages:
  - stage: BuildAndTest
    displayName: 'Build & test'
    jobs:
      - job: Build
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: UseDotNet@2
            displayName: 'Install .NET 10 SDK'
            inputs:
              packageType: 'sdk'
              version: '10.x'

          - script: dotnet restore
            displayName: 'dotnet restore'

          - script: dotnet build --configuration $(buildConfiguration) --no-restore
            displayName: 'dotnet build'

          # Del 16: excludes Atlas.Api.IntegrationTests, every one of which
          # carries [Trait("Category", "Integration")] (see that project's
          # own csproj doc comment). Those tests need a real LocalDB database,
          # Azurite, a local Redis container and `az login` — none of which
          # exist on this ubuntu-latest agent, unlike Atlas.Domain.Tests and
          # Atlas.Application.Tests, which mock every external dependency and
          # need nothing beyond the .NET SDK just installed above. Integration
          # tests stay a local-only, opt-in tier — run by hand with
          # `dotnet test --filter "Category=Integration"` once those
          # prerequisites are running — the same "local-only, not part of CI"
          # status this project's bash smoke-test scripts (scripts/test-*.sh)
          # already have, for the same reason.
          - script: dotnet test --configuration $(buildConfiguration) --no-build --filter "Category!=Integration"
            displayName: 'dotnet test (unit tests only — see comment above for why integration tests are excluded)'

          - script: >-
              dotnet publish src/Atlas.Api/Atlas.Api.csproj
              --configuration $(buildConfiguration)
              --no-build
              --output $(Build.ArtifactStagingDirectory)/publish
            displayName: 'dotnet publish'

          - publish: $(Build.ArtifactStagingDirectory)/publish
            displayName: 'Publish build artifact'
            artifact: drop

      # Del 18 — a second job in this stage, not a step tacked onto Build
      # above: it needs none of Build's dotnet restore/build/test output
      # (src/Atlas.Api/Dockerfile's own "build" stage does a completely
      # separate dotnet restore/publish *inside* the container, from source),
      # so giving it its own job lets Azure Pipelines run it in parallel with
      # Build rather than serially after it — though on a free-tier Azure
      # DevOps org with only one paid/free parallel job available, "eligible
      # to run in parallel" and "actually runs in parallel" aren't the same
      # thing; the two jobs may still queue one after another in practice.
      #
      # Deliberately just docker build, nothing more: this proves the
      # Dockerfile still builds — catches the kind of thing that silently
      # rots otherwise, like a COPY path left stale after a project rename,
      # or a project reference the multi-stage build no longer resolves —
      # the same value a compile step already gives the C# above it. It does
      # NOT push the image anywhere: no Azure Container Registry exists for
      # this project yet, and Deploy below still publishes to App Service
      # exactly as Del 8 set it up (Oryx build from the dotnet publish
      # output), unchanged. Whether to provision an ACR, push this image to
      # it, and switch App Service to Web App for Containers is a deliberate
      # follow-up decision, not something to fold into this Del — see
      # docs/AZURE_DEPLOYMENT.md's Del 18 section.
      #
      # A failing docker build here fails this stage, which — via Deploy's
      # own dependsOn: BuildAndTest below — blocks the App Service deploy
      # too, the same way a failing dotnet test already does. That's
      # intentional: a broken Dockerfile is a real regression, even though
      # nothing about it is on the App Service deploy's own critical path.
      #
      # No explicit Docker setup task needed: Azure Pipelines' Microsoft-
      # hosted ubuntu-latest pool image ships Docker Engine preinstalled.
      - job: DockerBuild
        displayName: 'Docker build (Del 17 image — verified, not pushed)'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - script: docker build -f src/Atlas.Api/Dockerfile -t projectatlas-api:$(Build.BuildId) .
            displayName: 'docker build (Atlas.Api, multi-stage)'

  - stage: Deploy
    displayName: 'Deploy to Azure App Service'
    dependsOn: BuildAndTest
    # Only deploy on an actual push to main — not on a PR build, even
    # though PR builds also run the BuildAndTest stage above.
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: DeployWebApp
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - download: current
            artifact: drop

          - task: AzureWebApp@1
            displayName: 'Deploy to Azure App Service'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              appName: '$(webAppName)'
              package: '$(Pipeline.Workspace)/drop'
